name: ci

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Enforces the branch flow of rule G8. Keep this job.
  policy:
    runs-on: ubuntu-latest
    steps:
      - name: Check branch flow
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.base_ref }}
          HEAD: ${{ github.head_ref }}
        run: |
          if [ "$EVENT" != "pull_request" ]; then
            echo "Not a pull request, nothing to check."
            exit 0
          fi
          if [ "$BASE" = "main" ]; then
            case "$HEAD" in
              develop|hotfix/*) ;;
              *) echo "::error::Pull requests into main must come from develop or hotfix/*. Target develop instead."; exit 1 ;;
            esac
          fi
          case "$HEAD" in
            develop|feat/*|fix/*|chore/*|docs/*|test/*|refactor/*|ci/*|hotfix/*|dependabot/*) ;;
            *) echo "::error::Branch '$HEAD' does not follow the naming rule (feat/, fix/, chore/, docs/, test/, refactor/, ci/, hotfix/)."; exit 1 ;;
          esac

  lint-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: pipx install uv==0.13.5
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: agrofarm
          POSTGRES_PASSWORD: ci-only
          POSTGRES_DB: agrofarm
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U agrofarm -d agrofarm"
          --health-interval 3s --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: postgresql+psycopg://agrofarm:ci-only@localhost:5432/agrofarm
    steps:
      - uses: actions/checkout@v7
      - run: pipx install uv==0.13.5
      - run: uv sync --frozen
      # Migration test: empty database up, all the way down, and up again.
      - run: uv run alembic upgrade head
      - run: uv run alembic downgrade base
      - run: uv run alembic upgrade head
      # Unit and integration tests with the coverage gate (fail_under in pyproject.toml).
      - run: uv run pytest --cov --cov-report=term-missing

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: pipx install uv==0.13.5
      - run: uv sync --frozen
      - run: make audit

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker build -t core-api:ci .
      - name: Trivy image scan
        run: >-
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:0.76.2
          image --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 core-api:ci

  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: bash -n infra/bootstrap.sh infra/github-protect.sh
      - run: docker run --rm -v "$PWD:/work" -w /work/infra/terraform hashicorp/terraform:1.9 fmt -check -recursive
      - run: |
          docker run --rm -v "$PWD:/work" -w /work/infra/terraform --entrypoint sh hashicorp/terraform:1.9 -c "terraform init -backend=false && terraform validate"

  # The single required status check (rule G3). Keep the job name stable.
  # Add every new job to `needs`. A skipped job counts as passed, so path
  # filters (rule G3.1) never block or bypass this gate.
  ci-gate:
    if: always()
    needs: [policy, lint-typecheck, test, audit, image, terraform]
    runs-on: ubuntu-latest
    steps:
      - name: Check results of all jobs
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Job results: $RESULTS"
          for result in $RESULTS; do
            case "$result" in
              success|skipped) ;;
              *) echo "::error::A required job ended with '$result'."; exit 1 ;;
            esac
          done
