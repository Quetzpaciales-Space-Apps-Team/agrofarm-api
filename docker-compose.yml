services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: agrofarm
      POSTGRES_PASSWORD: agrofarm
      POSTGRES_DB: agrofarm
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./deploy/init-db.sql:/docker-entrypoint-initdb.d/99-extensions.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U agrofarm -d agrofarm"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://agrofarm:agrofarm@db:5432/agrofarm
      CORS_ORIGINS: '["http://localhost:5173"]'
      LOG_LEVEL: INFO
      ENVIRONMENT: local
      PORT: "8080"
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
