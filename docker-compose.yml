# Local development: `docker compose up` gives the API on :8080 (set API_PORT to change it) and PostgreSQL.
services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: agrofarm
      POSTGRES_PASSWORD: local-dev-only
      POSTGRES_DB: agrofarm
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agrofarm -d agrofarm"]
      interval: 3s
      timeout: 3s
      retries: 20
    volumes:
      - db-data:/var/lib/postgresql/data

  migrate:
    build: .
    command: ["alembic", "upgrade", "head"]
    environment:
      DATABASE_URL: postgresql+psycopg://agrofarm:local-dev-only@db:5432/agrofarm
    depends_on:
      db:
        condition: service_healthy

  api:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://agrofarm:local-dev-only@db:5432/agrofarm
      ENVIRONMENT: local
      CORS_ALLOWED_ORIGINS: '["http://localhost:5173"]'
    ports:
      - "127.0.0.1:${API_PORT:-8080}:8080"
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  db-data:
